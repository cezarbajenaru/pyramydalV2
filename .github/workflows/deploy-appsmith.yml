name: Deploy Appsmith

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'update'
        type: choice
        options:
          - update
          - restart
          - backup
      appsmith_version:
        description: 'Appsmith version (leave empty for latest)'
        required: false
        default: 'v1.9.56'

env:
  AWS_REGION: 'eu-central-1'

jobs:
  deploy-appsmith:
    name: Deploy/Update Appsmith
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Get EC2 Instance IP
        id: ec2
        run: |
          INSTANCE_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=pyramydal-prod-appsmith" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
          echo "Found Appsmith instance at: $INSTANCE_IP"
      
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ steps.ec2.outputs.instance_ip }} >> ~/.ssh/known_hosts
      
      - name: Backup Appsmith Data (if requested)
        if: github.event.inputs.action == 'backup'
        run: |
          echo "Creating backup..."
          ssh -i ~/.ssh/ec2_key.pem ec2-user@${{ steps.ec2.outputs.instance_ip }} << 'EOF'
            cd /opt/appsmith
            BACKUP_FILE="appsmith-backup-$(date +%Y%m%d-%H%M%S).tar.gz"
            sudo tar -czf /tmp/$BACKUP_FILE stacks/
            aws s3 cp /tmp/$BACKUP_FILE s3://pyramydal-prod-files/backups/$BACKUP_FILE
            echo "Backup saved to S3: s3://pyramydal-prod-files/backups/$BACKUP_FILE"
          EOF
      
      - name: Update Appsmith Version
        if: github.event.inputs.action == 'update'
        run: |
          ssh -i ~/.ssh/ec2_key.pem ec2-user@${{ steps.ec2.outputs.instance_ip }} << 'EOF'
            cd /opt/appsmith
            
            # Backup before update
            echo "Creating pre-update backup..."
            BACKUP_FILE="pre-update-$(date +%Y%m%d-%H%M%S).tar.gz"
            sudo tar -czf /tmp/$BACKUP_FILE stacks/ || true
            
            # Update docker-compose.yml with new version
            sudo sed -i 's|appsmith/appsmith-ce:.*|appsmith/appsmith-ce:${{ github.event.inputs.appsmith_version }}|' docker-compose.yml
            
            # Pull new image
            echo "Pulling new Appsmith image..."
            sudo docker-compose pull
            
            # Restart with new image
            echo "Restarting Appsmith..."
            sudo docker-compose up -d
            
            # Check status
            sleep 10
            sudo docker-compose ps
            
            echo "✅ Appsmith updated to ${{ github.event.inputs.appsmith_version }}"
          EOF
      
      - name: Restart Appsmith
        if: github.event.inputs.action == 'restart'
        run: |
          ssh -i ~/.ssh/ec2_key.pem ec2-user@${{ steps.ec2.outputs.instance_ip }} << 'EOF'
            cd /opt/appsmith
            echo "Restarting Appsmith..."
            sudo docker-compose restart
            sleep 10
            sudo docker-compose ps
            echo "✅ Appsmith restarted"
          EOF
      
      - name: Verify Appsmith Health
        run: |
          echo "Checking Appsmith health..."
          HEALTH_URL="http://${{ steps.ec2.outputs.instance_ip }}/api/v1/health"
          
          for i in {1..5}; do
            if curl -f -s "$HEALTH_URL" > /dev/null; then
              echo "✅ Appsmith is healthy"
              exit 0
            fi
            echo "Waiting for Appsmith to be ready... (attempt $i/5)"
            sleep 15
          done
          
          echo "⚠️ Appsmith health check timed out"
      
      - name: Summary
        run: |
          echo "### Appsmith Deployment Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.event.inputs.appsmith_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${{ steps.ec2.outputs.instance_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **IMPORTANT:** Volumes are persistent and not affected by this deployment." >> $GITHUB_STEP_SUMMARY

